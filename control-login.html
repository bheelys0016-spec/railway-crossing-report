<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เข้าสู่ระบบ — ผังควบคุมการเดินรถ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-900:#FAF3E4;
    --steel-800:#FFFBF3;
    --steel-700:#F1E3D3;
    --steel-600:#E0C9AC;
    --steel-line:#C9A97E;
    --paper:#3A2419;
    --paper-dim:#8A6B4E;
    --amber:#A67C10;
    --amber-dim:#7A5B0C;
    --red:#7A1F2B;
    --red-dim:#F6DFE1;
    --green:#2F5233;
    --green-dim:#DCEBDD;
    --submit-stripe:#5C1620;
    --submit-shadow:#3A0F14;
    --status-text-neg:#5C1620;
    --deco-stroke:var(--red);
    --deco-opacity:.22;
    --radius:10px;
  }
  html[data-theme="dark"]{
    --steel-900:#1B1310;
    --steel-800:#26190F;
    --steel-700:#372316;
    --steel-600:#513521;
    --steel-line:#63432A;
    --paper:#F3E7D3;
    --paper-dim:#C6A87D;
    --amber:#D1A227;
    --amber-dim:#8C6A16;
    --red:#A32E2E;
    --red-dim:#441313;
    --green:#3E6B47;
    --green-dim:#1B3320;
    --submit-stripe:#7A2424;
    --submit-shadow:#2E0D0D;
    --status-text-neg:#f6c6cb;
    --deco-stroke:var(--amber);
    --deco-opacity:.16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--steel-900);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    position:relative;
  }
  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:80;
    width:42px;height:42px;border-radius:50%;
    background:var(--steel-800);border:1px solid var(--steel-line);
    color:var(--paper);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .lang-toggle{
    position:fixed;top:14px;right:64px;z-index:80;
    width:42px;height:42px;border-radius:10px;
    background:var(--steel-800);border:1px solid var(--steel-line);
    cursor:pointer;padding:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .lang-toggle svg{ width:26px;height:18px;border-radius:3px;display:block; }
  .rail-deco{
    position:fixed;top:0;bottom:0;width:260px;pointer-events:none;z-index:0;
    opacity:var(--deco-opacity);display:none;
  }
  .rail-deco.left{left:0;} .rail-deco.right{right:0;}
  .rail-deco svg{width:100%;height:100%;}
  @media (min-width:1180px){ .rail-deco{display:block;} }

  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:380px;
    background:var(--steel-800);
    border:1px solid var(--steel-line);
    border-radius:14px;
    padding:28px 26px;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--amber);margin:0 0 8px;
  }
  h1{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em;
    text-transform:uppercase;margin:0 0 6px;color:var(--paper);
  }
  .sub{font-size:12.5px;color:var(--paper-dim);margin:0 0 22px;line-height:1.6;}

  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block;font-size:12px;color:var(--paper-dim);margin-bottom:5px; }
  .field input{
    width:100%;background:var(--steel-700);border:1px solid var(--steel-line);
    border-radius:var(--radius);color:var(--paper);padding:11px 12px;
    font-family:'JetBrains Mono',monospace;font-size:14px;outline:none;
  }
  .field input:focus{ border-color:var(--red); }

  .err{
    display:none;margin:2px 0 14px;padding:9px 12px;border-radius:var(--radius);
    background:var(--red-dim);border:1px solid var(--red);color:var(--status-text-neg);font-size:12.5px;
    text-align:left;
  }
  .err.show{display:block;}

  .submit-bar{
    width:100%;margin-top:4px;padding:14px;border:none;border-radius:var(--radius);
    background:repeating-linear-gradient(135deg,var(--red) 0 16px,var(--submit-stripe) 16px 32px);
    color:#fff;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 3px 0 var(--submit-shadow);
  }
  .submit-bar:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--submit-shadow); }

  .hint{margin-top:18px;font-size:11px;color:var(--paper-dim);}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="สลับโหมดกลางวัน/กลางคืน">☀️</button>
<button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / เปลี่ยนภาษา">🇹🇭</button>

<div class="rail-deco left" aria-hidden="true">
  <svg viewBox="0 0 260 900" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--deco-stroke)" stroke-width="2">
    <path d="M150 90
      C 140 70, 118 65, 108 78
      C 96 92, 100 112, 92 126
      C 80 146, 60 150, 58 172
      C 56 196, 76 206, 80 228
      C 84 252, 66 264, 70 290
      C 74 316, 100 322, 104 348
      C 108 374, 90 388, 96 414
      C 100 432, 118 438, 122 458
      C 126 480, 110 492, 116 516
      C 121 538, 140 540, 143 562
      C 146 584, 132 596, 138 618
      C 143 636, 160 640, 162 660
      C 164 682, 150 692, 154 712
      C 157 728, 172 732, 172 748
      C 172 762, 160 768, 160 780"
      stroke-opacity=".55" stroke-width="2.4"/>
    <line x1="40" y1="820" x2="40" y2="900" stroke="var(--paper-dim)" stroke-width="2"/>
    <line x1="56" y1="820" x2="56" y2="900" stroke="var(--paper-dim)" stroke-width="2"/>
    <g stroke="var(--paper-dim)" stroke-width="2">
      <line x1="30" y1="828" x2="66" y2="828"/>
      <line x1="30" y1="844" x2="66" y2="844"/>
      <line x1="30" y1="860" x2="66" y2="860"/>
      <line x1="30" y1="876" x2="66" y2="876"/>
      <line x1="30" y1="892" x2="66" y2="892"/>
    </g>
  </svg>
</div>

<div class="rail-deco right" aria-hidden="true">
  <svg viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--deco-stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(10,140)">
      <path d="M40 -6 C 34 -16, 44 -22, 38 -32 C 32 -42, 44 -46, 40 -56" stroke-opacity=".6"/>
      <path d="M54 -2 C 50 -12, 58 -16, 54 -26" stroke-opacity=".4"/>
      <rect x="32" y="-2" width="16" height="26" rx="3"/>
      <rect x="18" y="24" width="150" height="46" rx="20"/>
      <path d="M70 24 q10 -16 24 0" />
      <path d="M168 24 h34 v46 h-56 v-24 q0 -22 22 -22 z"/>
      <rect x="182" y="34" width="16" height="14" rx="2"/>
      <path d="M18 70 l-16 26 h34 l6 -26 z"/>
      <line x1="8" y1="96" x2="210" y2="96"/>
      <circle cx="46" cy="96" r="22"/>
      <circle cx="46" cy="96" r="5"/>
      <circle cx="104" cy="104" r="30"/>
      <circle cx="104" cy="104" r="6"/>
      <circle cx="168" cy="96" r="22"/>
      <circle cx="168" cy="96" r="5"/>
      <line x1="46" y1="96" x2="168" y2="96" stroke-opacity=".7"/>
      <line x1="-10" y1="134" x2="230" y2="134" stroke="var(--paper-dim)" stroke-width="2"/>
      <g stroke="var(--paper-dim)" stroke-width="2">
        <line x1="0" y1="134" x2="0" y2="146"/>
        <line x1="30" y1="134" x2="30" y2="146"/>
        <line x1="60" y1="134" x2="60" y2="146"/>
        <line x1="90" y1="134" x2="90" y2="146"/>
        <line x1="120" y1="134" x2="120" y2="146"/>
        <line x1="150" y1="134" x2="150" y2="146"/>
        <line x1="180" y1="134" x2="180" y2="146"/>
        <line x1="210" y1="134" x2="210" y2="146"/>
      </g>
    </g>
  </svg>
</div>

<div class="login-card">
  <p class="eyebrow">Level crossing safety network</p>
  <h1 data-i18n="title">เข้าสู่ระบบ</h1>
  <p class="sub" data-i18n="subtitle">สำหรับผู้ควบคุมการเดินรถ — กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ผังควบคุม</p>

  <div class="field">
    <label for="userInput" data-i18n="userLabel">ชื่อผู้ใช้</label>
    <input id="userInput" type="text" autocomplete="username" spellcheck="false">
  </div>
  <div class="field">
    <label for="passInput" data-i18n="passLabel">รหัสผ่าน</label>
    <input id="passInput" type="password" autocomplete="current-password">
  </div>

  <div class="err" id="errBox" data-i18n="errMsg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

  <button class="submit-bar" id="loginBtn" data-i18n="loginBtn">เข้าสู่ระบบ</button>
  <p class="hint" data-i18n="hint">แต่ละบัญชีจะเห็นเฉพาะเหตุการณ์ในภาคที่ตนเองดูแลเท่านั้น</p>
</div>

<script>
(function(){
  /* ---------- day/night theme toggle ---------- */
  var THEME_KEY = 'railway-theme';
  var toggleBtn = document.getElementById('themeToggle');
  function applyTheme(mode){
    if (mode === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      toggleBtn.textContent = '☀️';
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  toggleBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

  /* ---------- language toggle (TH / EN) ---------- */
  var LANG_KEY = 'railway-lang';
  var FLAG_TH = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#A51931"/><rect y="3.33" width="30" height="13.34" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.66" fill="#2D2A4A"/></svg>';
  var FLAG_GB = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#00247D"/><g stroke="#FFFFFF" stroke-width="4"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#CF142B" stroke-width="1.6"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#FFFFFF" stroke-width="6"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g><g stroke="#CF142B" stroke-width="3"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g></svg>';
  var langToggle = document.getElementById('langToggle');
  var currentLang = 'th';
  var I18N = {
    th: {
      title: 'เข้าสู่ระบบ',
      subtitle: 'สำหรับผู้ควบคุมการเดินรถ — กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ผังควบคุม',
      userLabel: 'ชื่อผู้ใช้',
      passLabel: 'รหัสผ่าน',
      errMsg: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
      loginBtn: 'เข้าสู่ระบบ',
      hint: 'แต่ละบัญชีจะเห็นเฉพาะเหตุการณ์ในภาคที่ตนเองดูแลเท่านั้น'
    },
    en: {
      title: 'Sign In',
      subtitle: 'For train dispatch controllers — enter your username and password to access the control dashboard',
      userLabel: 'Username',
      passLabel: 'Password',
      errMsg: 'Incorrect username or password',
      loginBtn: 'Sign In',
      hint: 'Each account only sees incidents in the region they are responsible for'
    }
  };
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || key; }

  function applyLang(lang){
    currentLang = (lang === 'en') ? 'en' : 'th';
    document.documentElement.setAttribute('lang', currentLang);
    langToggle.innerHTML = currentLang === 'en' ? FLAG_GB : FLAG_TH;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
  }
  var savedLang = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch(e){}
  applyLang(savedLang === 'en' ? 'en' : 'th');
  langToggle.addEventListener('click', function(){
    var next = currentLang === 'en' ? 'th' : 'en';
    applyLang(next);
    try { localStorage.setItem(LANG_KEY, next); } catch(e){}
  });

  /* ---------- credentials ---------- */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq_lB981Yq4JZKKMMy5olDkf3xIaJgoZODZrWs7PwGB0r0t7YvtPQEmNVfxHCa9rb85g/exec';
  var ACCOUNTS = {
    'controller0001': { password: '3001', region: 'north' },
    'controller0002': { password: '3002', region: 'northeast' },
    'controller0003': { password: '3003', region: 'central' },
    'controller0004': { password: '3004', region: 'east' },
    'controller0005': { password: '3005', region: 'west' },
    'controller0006': { password: '3006', region: 'south' }
  };

  var userInput = document.getElementById('userInput');
  var passInput = document.getElementById('passInput');
  var errBox = document.getElementById('errBox');
  var loginBtn = document.getElementById('loginBtn');

  function attemptLogin(){
    var u = userInput.value.trim();
    var p = passInput.value.trim();
    var acc = ACCOUNTS[u];
    if (acc && acc.password === p){
      try { sessionStorage.setItem('control-auth', '1'); } catch(e){}
      try { sessionStorage.setItem('control-auth-user', u); } catch(e){}
      try { sessionStorage.setItem('control-region', acc.region); } catch(e){}
      logLogin(u);
      window.location.href = 'control-dashboard.html';
    } else {
      errBox.classList.add('show');
    }
  }

  function logLogin(username){
    try{
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: username, timestamp: new Date().toISOString() }),
        keepalive: true
      });
    }catch(e){}
  }

  loginBtn.addEventListener('click', attemptLogin);
  passInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') attemptLogin(); });
  userInput.addEventListener('input', function(){ errBox.classList.remove('show'); });
  passInput.addEventListener('input', function(){ errBox.classList.remove('show'); });
})();
</script>
</body>
</html>
