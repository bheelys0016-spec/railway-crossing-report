  var ok = false;

  if (!ok) { window.location.replace('login.html?redirect=stats-assistant.html'); }

<style>
  :root{
    --steel-900:#FAF3E4;
    --steel-800:#FFFBF3;
    --steel-700:#F1E3D3;
    --steel-600:#E0C9AC;
    --steel-line:#C9A97E;
    --paper:#3A2419;
    --paper-dim:#8A6B4E;
    --amber:#A67C10;
    --amber-dim:#7A5B0C;
    --red:#7A1F2B;
    --red-dim:#F6DFE1;
    --green:#2F5233;
    --green-dim:#DCEBDD;
    --deco-stroke:var(--red);
    --deco-opacity:.22;
    --radius:10px;
  }
  html[data-theme="dark"]{
    --steel-900:#1B1310;
    --steel-800:#26190F;
    --steel-700:#372316;
    --steel-600:#513521;
    --steel-line:#63432A;
    --paper:#F3E7D3;
    --paper-dim:#C6A87D;
    --amber:#D1A227;
    --amber-dim:#8C6A16;
    --red:#A32E2E;
    --red-dim:#441313;
    --green:#3E6B47;
    --green-dim:#1B3320;
    --deco-stroke:var(--amber);
    --deco-opacity:.16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-900);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 90px;position:relative;z-index:1;}
  header{padding:24px 18px 0;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--red);margin:0 0 6px;
  }
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em;
     text-transform:uppercase;margin:0 0 4px;color:var(--paper);}
  .sub{font-size:12.5px;color:var(--paper-dim);margin:0;line-height:1.6;}

  main{padding:16px 18px 0;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .chip{
    background:var(--steel-800);border:1px solid var(--steel-line);color:var(--paper-dim);
    border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer;
  }
  .chip:hover{ border-color:var(--red); color:var(--paper); }

  .chat-log{ margin-bottom:12px; }
  .msg{ display:flex; margin-bottom:12px; }
  .msg.user{ justify-content:flex-end; }
  .bubble{
    max-width:82%; padding:11px 14px; border-radius:14px; font-size:13.5px; line-height:1.65;
    white-space:pre-wrap;
  }
  .msg.bot .bubble{
    background:var(--steel-800); border:1px solid var(--steel-line); color:var(--paper);
    border-bottom-left-radius:4px;
  }
  .msg.user .bubble{
    background:var(--red); color:#fff; border-bottom-right-radius:4px;
  }

  .input-row{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    background:var(--steel-900); border-top:1px solid var(--steel-line);
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  }
  .input-row-inner{ max-width:640px; margin:0 auto; display:flex; gap:8px; }
  .input-row input{
    flex:1; background:var(--steel-700); border:1px solid var(--steel-line); color:var(--paper);
    border-radius:22px; padding:11px 16px; font-size:13.5px; outline:none;
  }
  .input-row input:focus{ border-color:var(--red); }
  .input-row button{
    background:var(--red); border:none; color:#fff; border-radius:50%;
    width:42px; height:42px; font-size:17px; cursor:pointer; flex:none;
  }

  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:80;
    width:42px;height:42px;border-radius:50%;
    background:var(--steel-800);border:1px solid var(--steel-line);
    color:var(--paper);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .lang-toggle{
    position:fixed;top:14px;right:64px;z-index:80;
    width:42px;height:42px;border-radius:10px;
    background:var(--steel-800);border:1px solid var(--steel-line);
    cursor:pointer;padding:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .lang-toggle svg{ width:26px;height:18px;border-radius:3px;display:block; }
  .rail-deco{
    position:fixed;top:0;bottom:0;width:260px;pointer-events:none;z-index:0;
    opacity:var(--deco-opacity);display:none;
  }
  .rail-deco.left{left:0;} .rail-deco.right{right:0;}
  .rail-deco svg{width:100%;height:100%;}
  @media (min-width:1180px){ .rail-deco{display:block;} }

  .train-nav{ position:fixed; left:16px; bottom:80px; z-index:90; }
  .train-nav-btn{
    width:56px;height:56px;border-radius:50%;
    background:var(--steel-800);border:2px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18);
    animation:trainBob 2.6s ease-in-out infinite;
  }
  @keyframes trainBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(-4deg); }
  }
  .train-menu{
    display:none;position:absolute;bottom:66px;left:0;
    background:var(--steel-800);border:1px solid var(--steel-line);
    border-radius:12px;padding:8px;min-width:190px;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
  }
  .train-menu.open{ display:block; }
  .train-menu a{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;border-radius:8px;text-decoration:none;
    color:var(--paper);font-size:13px;font-family:'Inter',sans-serif;
  }
  .train-menu a:hover{ background:var(--steel-700); }
  .train-menu a.current{ color:var(--red);font-weight:600; }
  .train-menu .emoji{ font-size:16px; }
</style>
</head>

<div class="wrap">
  <header>
    <p class="eyebrow">Level crossing safety network</p>
    <h1 data-i18n="title">ถาม-ตอบสถิติ</h1>
    <p class="sub" data-i18n="subtitle">พิมพ์คำถามเกี่ยวกับสถิติเหตุอันตราย ระบบจะคำนวณคำตอบจากข้อมูลสดในชีตให้ทันที — ไม่ใช่ AI สนทนาทั่วไป แต่เป็นตัวคำนวณคำถามด้านสถิติโดยเฉพาะ ตอบแม่นยำจากตัวเลขจริง</p>
  </header>

  <main>
    <div class="chips" id="quickChips">
      <button class="chip" data-chip="q1">วันนี้มีกี่เหตุ</button>
      <button class="chip" data-chip="q2">เดือนนี้มีกี่เหตุ</button>
      <button class="chip" data-chip="q3">ประเภทที่พบบ่อยสุด</button>
      <button class="chip" data-chip="q4">จังหวัดไหนเยอะสุด</button>
      <button class="chip" data-chip="q5">เหตุล่าสุด</button>
      <button class="chip" data-chip="q6">ทั้งหมดมีกี่เหตุ</button>
    </div>

    <div class="chat-log" id="chatLog"></div>
  </main>
</div>

<div class="input-row">
  <div class="input-row-inner">
    <input type="text" id="chatInput" data-i18n-placeholder="inputPlaceholder" placeholder="พิมพ์คำถาม เช่น วันนี้มีกี่เหตุ...">
    <button id="sendBtn" type="button" aria-label="ส่ง">➤</button>
  </div>
</div>

<script>
(function(){
  /* ---------- day/night theme toggle ---------- */
  var THEME_KEY = 'railway-theme';
  var toggleBtn = document.getElementById('themeToggle');
  function applyTheme(mode){
    if (mode === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      toggleBtn.textContent = '☀️';
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  toggleBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

  /* ---------- language toggle (TH / EN) ---------- */
  var LANG_KEY = 'railway-lang';
  var FLAG_TH = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#A51931"/><rect y="3.33" width="30" height="13.34" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.66" fill="#2D2A4A"/></svg>';
  var FLAG_GB = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#00247D"/><g stroke="#FFFFFF" stroke-width="4"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#CF142B" stroke-width="1.6"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#FFFFFF" stroke-width="6"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g><g stroke="#CF142B" stroke-width="3"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g></svg>';
  var langToggle = document.getElementById('langToggle');
  var currentLang = 'th';
  var CHIP_QUESTIONS = {
    th: {
      q1: 'วันนี้มีกี่เหตุ', q2: 'เดือนนี้มีกี่เหตุ', q3: 'ประเภทเหตุที่พบบ่อยที่สุด',
      q4: 'จังหวัดไหนมีเหตุมากที่สุด', q5: 'เหตุล่าสุดคือเมื่อไหร่', q6: 'ทั้งหมดมีกี่เหตุ'
    },
    en: {
      q1: 'how many incidents today', q2: 'how many incidents this month', q3: 'most common incident type',
      q4: 'which province has the most incidents', q5: 'when was the latest incident', q6: 'how many incidents in total'
    }
  };
  var CHIP_LABELS = {
    th: { q1:'วันนี้มีกี่เหตุ', q2:'เดือนนี้มีกี่เหตุ', q3:'ประเภทที่พบบ่อยสุด', q4:'จังหวัดไหนเยอะสุด', q5:'เหตุล่าสุด', q6:'ทั้งหมดมีกี่เหตุ' },
    en: { q1:'Today', q2:'This month', q3:'Top incident type', q4:'Top province', q5:'Latest incident', q6:'Total' }
  };
  var I18N = {
    th: {
      title: 'ถาม-ตอบสถิติ',
      subtitle: 'พิมพ์คำถามเกี่ยวกับสถิติเหตุอันตราย ระบบจะคำนวณคำตอบจากข้อมูลสดในชีตให้ทันที — ไม่ใช่ AI สนทนาทั่วไป แต่เป็นตัวคำนวณคำถามด้านสถิติโดยเฉพาะ ตอบแม่นยำจากตัวเลขจริง',
      inputPlaceholder: 'พิมพ์คำถาม เช่น วันนี้มีกี่เหตุ...',
      greeting: 'สวัสดีครับ ผมช่วยตอบคำถามเกี่ยวกับสถิติเหตุอันตรายจากข้อมูลสดในระบบได้ ลองถามได้เลย หรือกดปุ่มคำถามด่วนด้านบนก็ได้ครับ',
      thinking: 'กำลังคำนวณ...',
      notLoaded: 'ยังโหลดข้อมูลไม่เสร็จ รอสักครู่แล้วลองถามใหม่นะครับ',
      emptyInput: 'พิมพ์คำถามก่อนนะครับ เช่น "วันนี้มีกี่เหตุ"',
      noIncidentsAtAll: 'ยังไม่มีข้อมูลเหตุการณ์ในระบบเลยครับ',
      noneInRange: 'ไม่พบข้อมูลเหตุในช่วง',
      rangeToday: 'วันนี้', rangeYesterday: 'เมื่อวาน', range7d: '7 วันที่ผ่านมา', range30d: '30 วันที่ผ่านมา',
      rangeAll: 'ทั้งหมดที่มีการบันทึกไว้', rangeUnspec: 'ทั้งหมดที่มีการบันทึกไว้ (ไม่ได้ระบุช่วงเวลา)',
      geoNotReady: 'ระบบยังโหลดข้อมูลแผนที่จังหวัดไม่เสร็จ ลองใหม่อีกครั้งครับ',
      noProvinceData: 'ยังไม่มีเหตุที่ระบุตำแหน่ง GPS ไว้เลยครับ เลยยังบอกจังหวัดไม่ได้',
      fallback: 'ขออภัยครับ ยังไม่เข้าใจคำถามนี้ ลองถามในรูปแบบเช่น:\n• "วันนี้มีกี่เหตุ"\n• "เดือนนี้มีกี่เหตุ"\n• "ประเภทเหตุที่พบบ่อยที่สุด"\n• "จังหวัดไหนมีเหตุมากที่สุด"\n• "จุดตัดไหนมีเหตุมากที่สุด"\n• "เหตุล่าสุดคือเมื่อไหร่"\n• "เครื่องกั้นชำรุดกี่ครั้ง"',
      locale: 'th-TH'
    },
    en: {
      title: 'Statistics Q&A',
      subtitle: 'Type a question about hazard statistics — the system computes a real answer from the live sheet data instantly. This is not a general-purpose AI chatbot, but a stats-specific calculator that answers accurately from real numbers.',
      inputPlaceholder: 'Type a question, e.g. how many incidents today...',
      greeting: "Hi! I can answer questions about hazard statistics using the system's live data. Ask away, or tap one of the quick questions above.",
      thinking: 'Calculating...',
      notLoaded: 'Still loading data — wait a moment and ask again.',
      emptyInput: 'Type a question first, e.g. "how many incidents today"',
      noIncidentsAtAll: "There's no incident data in the system yet.",
      noneInRange: 'No incidents found in ',
      rangeToday: 'today', rangeYesterday: 'yesterday', range7d: 'the last 7 days', range30d: 'the last 30 days',
      rangeAll: 'all recorded data', rangeUnspec: 'all recorded data (no time range specified)',
      geoNotReady: 'The province map data is still loading — please try again.',
      noProvinceData: "No incidents have a GPS location yet, so I can't tell provinces apart.",
      fallback: 'Sorry, I didn\'t understand that question. Try something like:\n• "how many incidents today"\n• "how many incidents this month"\n• "most common incident type"\n• "which province has the most incidents"\n• "which crossing has the most incidents"\n• "when was the latest incident"\n• "how many gate malfunctions"',
      locale: 'en-GB'
    }
  };
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || key; }

  function applyLang(lang){
    currentLang = (lang === 'en') ? 'en' : 'th';
    document.documentElement.setAttribute('lang', currentLang);
    langToggle.innerHTML = currentLang === 'en' ? FLAG_GB : FLAG_TH;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
    });
    document.querySelectorAll('.chip').forEach(function(chip){
      var key = chip.getAttribute('data-chip');
      chip.textContent = CHIP_LABELS[currentLang][key];
    });
  }
  var savedLang = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch(e){}

  var PROVINCE_LOOKUP = {};

  function toDriveThumb(url){

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- point in polygon ---------- */
  function pointInRing(pt, ring){
    var x = pt[0], y = pt[1], inside = false;
    for (var i=0,j=ring.length-1; i<ring.length; j=i++){
      var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      var intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }
  function pointInPolygon(pt, poly){
    if (!pointInRing(pt, poly[0])) return false;
    for (var k=1;k<poly.length;k++){ if (pointInRing(pt, poly[k])) return false; }
    return true;
  }
  function pointInGeometry(pt, geom){
    if (!geom) return false;
    if (geom.type === 'Polygon') return pointInPolygon(pt, geom.coordinates);
    if (geom.type === 'MultiPolygon') return geom.coordinates.some(function(p){ return pointInPolygon(pt, p); });
    return false;
  }

  /* ---------- data loading ---------- */

  async function loadGeo(){
    try{
      var resp = await fetch(GEOJSON_URL);
      geoData = await resp.json();
      geoData.features.forEach(function(f){
        var key = norm(f.properties && f.properties.name);
        var match = PROVINCE_LOOKUP[key];
        f.properties._th = match ? match.th : (f.properties.name || 'ไม่ทราบชื่อ');
        f.properties._region = match ? match.region : 'central';
      });
    }catch(e){
      geoLoadFailed = true;
    }
  }

  function assignProvince(incident){
    if (incident._province !== undefined) return incident._province;
    var gps = incident.gps;
    if (!gps || typeof gps !== 'string' || gps.indexOf(',') === -1){ incident._province = null; return null; }
    var parts = gps.split(',');
    var lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lng)){ incident._province = null; return null; }
    incident._lat = lat; incident._lng = lng;
    if (!geoData){ incident._province = null; return null; }
    var pt = [lng, lat];
    for (var i=0;i<geoData.features.length;i++){
      var f = geoData.features[i];
      if (pointInGeometry(pt, f.geometry)){
        incident._province = f.properties._th;
        incident._region = f.properties._region;
        return incident._province;
      }
    }
    incident._province = null;
    return null;
  }

  /* ==================================================================
     QUERY ENGINE — parses Thai questions and computes real answers
     ================================================================== */
  function withinRange(ts, rangeKey){
    var d = new Date(ts), now = new Date();
    if (isNaN(d.getTime())) return false;
    if (rangeKey === 'today'){
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    }
    if (rangeKey === 'yesterday'){
      var y = new Date(now); y.setDate(y.getDate()-1);
      return d.getFullYear()===y.getFullYear() && d.getMonth()===y.getMonth() && d.getDate()===y.getDate();
    }
    if (rangeKey === '7d') return (now - d) <= 7*86400000;
    if (rangeKey === '30d') return (now - d) <= 30*86400000;
    return true;
  }

  function detectRange(q){
    if (/เมื่อวาน|yesterday/i.test(q)) return {key:'yesterday', label:t('rangeYesterday')};
    if (/วันนี้|today/i.test(q)) return {key:'today', label:t('rangeToday')};
    if (/สัปดาห์นี้|7\s*วัน|เจ็ดวัน|7\s*days?|this week|last week/i.test(q)) return {key:'7d', label:t('range7d')};
    if (/เดือนนี้|30\s*วัน|30\s*days?|this month/i.test(q)) return {key:'30d', label:t('range30d')};
    if (/ทั้งหมด|ทุกวัน|รวมทั้งหมด|all time|in total|altogether/i.test(q)) return {key:'all', label:t('rangeAll')};
    return {key:'all', label:t('rangeUnspec')};
  }

  function countBy(arr, keyFn){
    var counts = {};
    arr.forEach(function(i){
      var k = keyFn(i);
      if (!k) return;
      counts[k] = (counts[k] || 0) + 1;
    });
    return Object.entries(counts).sort(function(a,b){ return b[1]-a[1]; });
  }

  function fmtDateTime(ts){
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '-';
    var timeWord = currentLang === 'en' ? ' at ' : ' เวลา ';
    return d.toLocaleDateString(t('locale'),{day:'2-digit',month:'2-digit',year:'numeric'}) + timeWord +
      d.toLocaleTimeString(t('locale'),{hour:'2-digit',minute:'2-digit'});
  }

  var TYPE_TRANSLATE = {
    'เครื่องกั้นไม่ลง': 'Gate not lowering',
    'เครื่องกั้นชำรุด': 'Gate malfunction',
    'สัญญาณไฟ-เสียงไม่ทำงาน': 'Lights/alarm not working',
    'รถติดในราง': 'Vehicle stuck on tracks',
    'คนหรือสัตว์ในราง': 'Person/animal on tracks',
    'อื่นๆ': 'Other'
  };
  function typeLabel(thType){
    if (currentLang === 'en') return TYPE_TRANSLATE[thType] || thType || 'Unspecified';
    return thType || 'ไม่ระบุประเภท';
  }
  function timesWord(n){ return currentLang === 'en' ? (n===1 ? ' time' : ' times') : ' ครั้ง'; }

  async function answerQuestion(rawQ){
    var q = rawQ.trim();
    if (!q) return t('emptyInput');

    if (!incidents.length && !geoData){
      return t('notLoaded');
    }

    var range = detectRange(q);
    var filtered = incidents.filter(function(i){ return withinRange(i.timestamp, range.key); });
    var inRangeWord = currentLang === 'en' ? ('in ' + range.label) : ('ในช่วง' + range.label);
    var noneInRangeMsg = currentLang === 'en' ? (t('noneInRange') + range.label + '.') : (t('noneInRange') + range.label + 'เลยครับ');

    // "latest"
    if (/ล่าสุด|latest|most recent/i.test(q)){
      if (!incidents.length) return t('noIncidentsAtAll');
      var sorted = incidents.slice().sort(function(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); });
      var latest = sorted[0];
      if (currentLang === 'en'){
        return 'The latest reported incident is "' + typeLabel(latest.type) + '" at crossing ' +
          (latest.crossingId || '-') + ' on ' + fmtDateTime(latest.timestamp) +
          (latest.note ? ('\nDetails: ' + latest.note) : '');
      }
      return 'เหตุล่าสุดที่แจ้งเข้ามาคือ "' + typeLabel(latest.type) + '" ที่จุดตัด ' +
        (latest.crossingId || '-') + ' เมื่อ ' + fmtDateTime(latest.timestamp) +
        (latest.note ? ('\nรายละเอียด: ' + latest.note) : '');
    }

    // most common incident type
    if (/ประเภท.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*ประเภท|most common.*type|common(est)? incident type|type.*most/i.test(q)){
      var byType = countBy(filtered, function(i){ return i.type; });
      if (!byType.length) return noneInRangeMsg;
      var topType = byType[0];
      if (currentLang === 'en'){
        var typeLinesEn = byType.slice(0,5).map(function(p){ return '• ' + typeLabel(p[0]) + ': ' + p[1] + timesWord(p[1]); }).join('\n');
        return 'The most common incident type ' + inRangeWord + ' is "' + typeLabel(topType[0]) + '" (' + topType[1] + timesWord(topType[1]) + ')\n\nFull ranking:\n' + typeLinesEn;
      }
      var typeLines = byType.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' ประเภทเหตุที่พบบ่อยที่สุดคือ "' + topType[0] + '" (' + topType[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + typeLines;
    }

    // which province has the most incidents
    if (/จังหวัด.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*จังหวัด|province.*most|most.*province/i.test(q)){
      if (!geoData) return t('geoNotReady');
      filtered.forEach(function(i){ assignProvince(i); });
      var withProvince = filtered.filter(function(i){ return i._province; });
      var byProvince = countBy(withProvince, function(i){ return i._province; });
      if (!byProvince.length) return (currentLang === 'en' ? (t('noneInRange') + range.label + ' — ' + t('noProvinceData')) : ('ในช่วง' + range.label + ' ' + t('noProvinceData')));
      var topProv = byProvince[0];
      if (currentLang === 'en'){
        var provLinesEn = byProvince.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + timesWord(p[1]); }).join('\n');
        return 'The province with the most incidents ' + inRangeWord + ' is "' + topProv[0] + '" (' + topProv[1] + timesWord(topProv[1]) + ')\n\nFull ranking:\n' + provLinesEn;
      }
      var provLines = byProvince.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' จังหวัดที่มีเหตุมากที่สุดคือ "' + topProv[0] + '" (' + topProv[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + provLines;
    }

    // which crossing has the most incidents
    if (/จุด(ตัด)?.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*จุด(ตัด)?|crossing.*most|most.*crossing/i.test(q)){
      var byCrossing = countBy(filtered, function(i){ return i.crossingId; });
      if (!byCrossing.length) return noneInRangeMsg;
      var topCrossing = byCrossing[0];
      if (currentLang === 'en'){
        var crossingLinesEn = byCrossing.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + timesWord(p[1]); }).join('\n');
        return 'The crossing with the most incidents ' + inRangeWord + ' is "' + topCrossing[0] + '" (' + topCrossing[1] + timesWord(topCrossing[1]) + ')\n\nFull ranking:\n' + crossingLinesEn;
      }
      var crossingLines = byCrossing.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' จุดตัดที่มีเหตุมากที่สุดคือ "' + topCrossing[0] + '" (' + topCrossing[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + crossingLines;
    }

    // specific incident type count (e.g. "เครื่องกั้นชำรุดกี่ครั้ง" / "how many gate malfunctions")
    var knownTypes = ['เครื่องกั้นไม่ลง','เครื่องกั้นชำรุด','สัญญาณไฟ-เสียงไม่ทำงาน','สัญญาณไฟ','รถติดในราง','คนหรือสัตว์ในราง','คน/สัตว์'];
    for (var ti=0; ti<knownTypes.length; ti++){
      var thTerm = knownTypes[ti];
      var enTerm = TYPE_TRANSLATE[thTerm];
      var matched = q.indexOf(thTerm) !== -1 || (enTerm && q.toLowerCase().indexOf(enTerm.toLowerCase()) !== -1);
      if (matched){
        var matchType = filtered.filter(function(i){ return (i.type||'').indexOf(thTerm.split('-')[0].slice(0,4)) !== -1 || i.type === thTerm; });
        if (currentLang === 'en'){
          return 'There ' + (matchType.length===1?'was':'were') + ' ' + matchType.length + ' "' + (enTerm||thTerm) + '" incident' + (matchType.length===1?'':'s') + ' reported ' + inRangeWord + '.';
        }
        return 'ในช่วง' + range.label + ' เหตุประเภท "' + thTerm + '" มีการแจ้งเข้ามา ' + matchType.length + ' ครั้งครับ';
      }
    }

    // generic count (กี่เหตุ / จำนวน / เท่าไหร่ / ทั้งหมด / how many)
    if (/กี่เหตุ|กี่ครั้ง|จำนวนเหตุ|เหตุเท่าไหร่|มีเหตุ|ทั้งหมดมี|how many|total (number|count)/i.test(q)){
      if (currentLang === 'en'){
        return 'There ' + (filtered.length===1?'was':'were') + ' a total of ' + filtered.length + ' incident' + (filtered.length===1?'':'s') + ' reported ' + inRangeWord + '.';
      }
      return 'ในช่วง' + range.label + ' มีเหตุที่แจ้งเข้ามาทั้งหมด ' + filtered.length + ' ครั้งครับ';
    }

    return t('fallback');
  }

  /* ---------- chat UI wiring ---------- */
  var chatLog = document.getElementById('chatLog');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');

  function addMsg(text, who){
    var row = document.createElement('div');
    row.className = 'msg ' + who;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatLog.appendChild(row);
    window.scrollTo(0, document.body.scrollHeight);
    return bubble;
  }

  async function handleSend(qText){
    var q = (qText !== undefined ? qText : chatInput.value).trim();
    if (!q) return;
    addMsg(q, 'user');
    chatInput.value = '';
    var loadingBubble = addMsg(t('thinking'), 'bot');
    var answer = await answerQuestion(q);
    loadingBubble.textContent = answer;
    window.scrollTo(0, document.body.scrollHeight);
  }

  sendBtn.addEventListener('click', function(){ handleSend(); });
  chatInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var key = chip.getAttribute('data-chip');
      handleSend(CHIP_QUESTIONS[currentLang][key]);
    });
  });

  addMsg(t('greeting'), 'bot');

  (async function init(){
    await Promise.all([loadIncidents(), loadGeo()]);
  })();
})();
