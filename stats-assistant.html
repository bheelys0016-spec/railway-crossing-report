<script>
(function(){
  /* ---------- day/night theme toggle ---------- */
  var THEME_KEY = 'railway-theme';
  var toggleBtn = document.getElementById('themeToggle');
  function applyTheme(mode){
    if (mode === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      toggleBtn.textContent = '☀️';
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  toggleBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

  /* ---------- floating train nav ---------- */

    var trainBtn = document.getElementById('trainNavBtn');
    var trainMenu = document.getElementById('trainMenu');
    trainBtn.addEventListener('click', function(e){
      e.stopPropagation();
      trainMenu.classList.toggle('open');
    });
    document.addEventListener('click', function(e){
      if (!trainMenu.contains(e.target) && e.target !== trainBtn) trainMenu.classList.remove('open');
    });
    var link = trainMenu.querySelector('[data-page="assistant"]');
    if (link) link.classList.add('current');
  })();

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq_lB981Yq4JZKKMMy5olDkf3xIaJgoZODZrWs7PwGB0r0t7YvtPQEmNVfxHCa9rb85g/exec';
  var GEOJSON_URL = 'https://raw.githubusercontent.com/apisit/thailand.json/master/thailand.json';

  var incidents = [];
  var geoData = null;

  function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z]/g,''); }

  // English-name-key -> {th, region}

    ['Bangkok','กรุงเทพมหานคร','central',['krungthep','krungthepmahanakhon']],
    ['Nonthaburi','นนทบุรี','central'],
    ['Pathum Thani','ปทุมธานี','central'],
    ['Samut Prakan','สมุทรปราการ','central'],
    ['Nakhon Pathom','นครปฐม','central'],
    ['Samut Sakhon','สมุทรสาคร','central'],
    ['Samut Songkhram','สมุทรสงคราม','central'],
    ['Phra Nakhon Si Ayutthaya','พระนครศรีอยุธยา','central',['ayutthaya']],
    ['Ang Thong','อ่างทอง','central'],
    ['Suphan Buri','สุพรรณบุรี','central',['suphanburi']],
    ['Lop Buri','ลพบุรี','central',['lopburi']],
    ['Saraburi','สระบุรี','central'],
    ['Sing Buri','สิงห์บุรี','central',['singburi']],
    ['Chai Nat','ชัยนาท','central',['chainat']],
    ['Nakhon Nayok','นครนายก','central'],
    ['Chon Buri','ชลบุรี','east',['chonburi']],
    ['Rayong','ระยอง','east'],
    ['Chanthaburi','จันทบุรี','east'],
    ['Trat','ตราด','east'],
    ['Chachoengsao','ฉะเชิงเทรา','east'],
    ['Prachin Buri','ปราจีนบุรี','east',['prachinburi']],
    ['Sa Kaeo','สระแก้ว','east',['sakaeo','sakeo']],
    ['Kanchanaburi','กาญจนบุรี','west'],
    ['Ratchaburi','ราชบุรี','west'],
    ['Phetchaburi','เพชรบุรี','west'],
    ['Prachuap Khiri Khan','ประจวบคีรีขันธ์','west',['prachuap']],
    ['Chiang Mai','เชียงใหม่','north'],
    ['Chiang Rai','เชียงราย','north'],
    ['Lamphun','ลำพูน','north'],
    ['Lampang','ลำปาง','north'],
    ['Phrae','แพร่','north'],
    ['Nan','น่าน','north'],
    ['Phayao','พะเยา','north'],
    ['Mae Hong Son','แม่ฮ่องสอน','north'],
    ['Uttaradit','อุตรดิตถ์','north'],
    ['Sukhothai','สุโขทัย','north'],
    ['Tak','ตาก','north'],
    ['Kamphaeng Phet','กำแพงเพชร','north'],
    ['Phichit','พิจิตร','north'],
    ['Phitsanulok','พิษณุโลก','north'],
    ['Phetchabun','เพชรบูรณ์','north'],
    ['Nakhon Sawan','นครสวรรค์','north'],
    ['Uthai Thani','อุทัยธานี','north'],
    ['Nakhon Ratchasima','นครราชสีมา','northeast'],

  var PROVINCE_LOOKUP = {};
  RAW_PROVINCES.forEach(function(row){
    var en = row[0], th = row[1], region = row[2], aliases = row[3] || [];
    var entry = {en: en, th: th, region: region};
    PROVINCE_LOOKUP[norm(en)] = entry;
    aliases.forEach(function(a){ PROVINCE_LOOKUP[norm(a)] = entry; });
  });

  var incidents = [];
  var geoData = null;
  var geoLoadFailed = false;
  var provinceCounts = {}; // th name -> filtered incidents array
  var currentRange = '7d';
  var currentRegion = 'all';

  function toDriveThumb(url){
    if (!url) return url;
    var m = /[?&]id=([^&]+)/.exec(url);
    return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000') : url;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- point in polygon ---------- */
  function pointInRing(pt, ring){
    var x = pt[0], y = pt[1], inside = false;
    for (var i=0,j=ring.length-1; i<ring.length; j=i++){
      var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      var intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }
  function pointInPolygon(pt, poly){
    if (!pointInRing(pt, poly[0])) return false;
    for (var k=1;k<poly.length;k++){ if (pointInRing(pt, poly[k])) return false; }
    return true;
  }
  function pointInGeometry(pt, geom){
    if (!geom) return false;
    if (geom.type === 'Polygon') return pointInPolygon(pt, geom.coordinates);
    if (geom.type === 'MultiPolygon') return geom.coordinates.some(function(p){ return pointInPolygon(pt, p); });
    return false;
  }

  /* ---------- data loading ---------- */
  async function loadIncidents(){
    try{
      var resp = await fetch(SCRIPT_URL, { method:'GET' });
      var data = await resp.json();
      incidents = Array.isArray(data) ? data : [];
    }catch(e){ incidents = []; }
  }

  async function loadGeo(){
    try{
      var resp = await fetch(GEOJSON_URL);
      geoData = await resp.json();
      geoData.features.forEach(function(f){
        var key = norm(f.properties && f.properties.name);
        var match = PROVINCE_LOOKUP[key];
        f.properties._th = match ? match.th : (f.properties.name || 'ไม่ทราบชื่อ');
        f.properties._region = match ? match.region : 'central';
      });
    }catch(e){
      geoLoadFailed = true;
    }
  }

  function assignProvince(incident){
    if (incident._province !== undefined) return incident._province;
    var gps = incident.gps;
    if (!gps || typeof gps !== 'string' || gps.indexOf(',') === -1){ incident._province = null; return null; }
    var parts = gps.split(',');
    var lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lng)){ incident._province = null; return null; }
    incident._lat = lat; incident._lng = lng;
    if (!geoData){ incident._province = null; return null; }
    var pt = [lng, lat];
    for (var i=0;i<geoData.features.length;i++){
      var f = geoData.features[i];
      if (pointInGeometry(pt, f.geometry)){
        incident._province = f.properties._th;
        incident._region = f.properties._region;
        return incident._province;
      }
    }
    incident._province = null;
    return null;
  }

  var geoLoadFailed = false;

  /* ==================================================================
     QUERY ENGINE — parses Thai questions and computes real answers
     ================================================================== */
  function withinRange(ts, rangeKey){
    var d = new Date(ts), now = new Date();
    if (isNaN(d.getTime())) return false;
    if (rangeKey === 'today'){
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    }
    if (rangeKey === 'yesterday'){
      var y = new Date(now); y.setDate(y.getDate()-1);
      return d.getFullYear()===y.getFullYear() && d.getMonth()===y.getMonth() && d.getDate()===y.getDate();
    }
    if (rangeKey === '7d') return (now - d) <= 7*86400000;
    if (rangeKey === '30d') return (now - d) <= 30*86400000;
    return true;
  }

  function detectRange(q){
    if (/เมื่อวาน/.test(q)) return {key:'yesterday', label:'เมื่อวาน'};
    if (/วันนี้/.test(q)) return {key:'today', label:'วันนี้'};
    if (/สัปดาห์นี้|7\s*วัน|เจ็ดวัน/.test(q)) return {key:'7d', label:'7 วันที่ผ่านมา'};
    if (/เดือนนี้|30\s*วัน/.test(q)) return {key:'30d', label:'30 วันที่ผ่านมา'};
    if (/ทั้งหมด|ทุกวัน|รวมทั้งหมด/.test(q)) return {key:'all', label:'ทั้งหมดที่มีการบันทึกไว้'};
    return {key:'all', label:'ทั้งหมดที่มีการบันทึกไว้ (ไม่ได้ระบุช่วงเวลา)'};
  }

  function countBy(arr, keyFn){
    var counts = {};
    arr.forEach(function(i){
      var k = keyFn(i);
      if (!k) return;
      counts[k] = (counts[k] || 0) + 1;
    });
    return Object.entries(counts).sort(function(a,b){ return b[1]-a[1]; });
  }

  function fmtDateTime(ts){
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' เวลา ' +
      d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  }

  async function answerQuestion(rawQ){
    var q = rawQ.trim();
    if (!q) return 'พิมพ์คำถามก่อนนะครับ เช่น "วันนี้มีกี่เหตุ"';

    if (!incidents.length && !geoData){
      return 'ยังโหลดข้อมูลไม่เสร็จ รอสักครู่แล้วลองถามใหม่นะครับ';
    }

    var range = detectRange(q);
    var filtered = incidents.filter(function(i){ return withinRange(i.timestamp, range.key); });

    // "ล่าสุด"
    if (/ล่าสุด/.test(q)){
      if (!incidents.length) return 'ยังไม่มีข้อมูลเหตุการณ์ในระบบเลยครับ';
      var sorted = incidents.slice().sort(function(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); });
      var latest = sorted[0];
      return 'เหตุล่าสุดที่แจ้งเข้ามาคือ "' + (latest.type || 'ไม่ระบุประเภท') + '" ที่จุดตัด ' +
        (latest.crossingId || '-') + ' เมื่อ ' + fmtDateTime(latest.timestamp) +
        (latest.note ? ('\nรายละเอียด: ' + latest.note) : '');
    }

    // ประเภทที่พบบ่อยที่สุด
    if (/ประเภท.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*ประเภท/.test(q)){
      var byType = countBy(filtered, function(i){ return i.type; });
      if (!byType.length) return 'ไม่พบข้อมูลเหตุในช่วง' + range.label + 'เลยครับ';
      var topType = byType[0];
      var typeLines = byType.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' ประเภทเหตุที่พบบ่อยที่สุดคือ "' + topType[0] + '" (' + topType[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + typeLines;
    }

    // จังหวัดไหนเยอะสุด
    if (/จังหวัด.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*จังหวัด/.test(q)){
      if (!geoData) return 'ระบบยังโหลดข้อมูลแผนที่จังหวัดไม่เสร็จ ลองใหม่อีกครั้งครับ';
      filtered.forEach(function(i){ assignProvince(i); });
      var withProvince = filtered.filter(function(i){ return i._province; });
      var byProvince = countBy(withProvince, function(i){ return i._province; });
      if (!byProvince.length) return 'ในช่วง' + range.label + ' ยังไม่มีเหตุที่ระบุตำแหน่ง GPS ไว้เลยครับ เลยยังบอกจังหวัดไม่ได้';
      var topProv = byProvince[0];
      var provLines = byProvince.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' จังหวัดที่มีเหตุมากที่สุดคือ "' + topProv[0] + '" (' + topProv[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + provLines;
    }

    // จุดตัดไหนเยอะสุด
    if (/จุด(ตัด)?.*(บ่อย|มาก|เยอะ)|(บ่อย|มาก|เยอะ).*จุด(ตัด)?/.test(q)){
      var byCrossing = countBy(filtered, function(i){ return i.crossingId; });
      if (!byCrossing.length) return 'ไม่พบข้อมูลเหตุในช่วง' + range.label + 'เลยครับ';
      var topCrossing = byCrossing[0];
      var crossingLines = byCrossing.slice(0,5).map(function(p){ return '• ' + p[0] + ': ' + p[1] + ' ครั้ง'; }).join('\n');
      return 'ในช่วง' + range.label + ' จุดตัดที่มีเหตุมากที่สุดคือ "' + topCrossing[0] + '" (' + topCrossing[1] + ' ครั้ง)\n\nอันดับทั้งหมด:\n' + crossingLines;
    }

    // ถามประเภทเหตุเฉพาะเจาะจง (เช่น "เครื่องกั้นชำรุดกี่ครั้ง")
    var knownTypes = ['เครื่องกั้นไม่ลง','เครื่องกั้นชำรุด','สัญญาณไฟ-เสียงไม่ทำงาน','สัญญาณไฟ','รถติดในราง','คนหรือสัตว์ในราง','คน/สัตว์'];
    for (var t=0; t<knownTypes.length; t++){
      if (q.indexOf(knownTypes[t]) !== -1){
        var matchType = filtered.filter(function(i){ return (i.type||'').indexOf(knownTypes[t].split('-')[0].slice(0,4)) !== -1 || i.type === knownTypes[t]; });
        return 'ในช่วง' + range.label + ' เหตุประเภท "' + knownTypes[t] + '" มีการแจ้งเข้ามา ' + matchType.length + ' ครั้งครับ';
      }
    }

    // นับจำนวนทั่วไป (กี่เหตุ / จำนวน / เท่าไหร่ / ทั้งหมด)
    if (/กี่เหตุ|กี่ครั้ง|จำนวนเหตุ|เหตุเท่าไหร่|มีเหตุ|ทั้งหมดมี/.test(q)){
      return 'ในช่วง' + range.label + ' มีเหตุที่แจ้งเข้ามาทั้งหมด ' + filtered.length + ' ครั้งครับ';
    }

    // fallback
    return 'ขออภัยครับ ยังไม่เข้าใจคำถามนี้ ลองถามในรูปแบบเช่น:\n• "วันนี้มีกี่เหตุ"\n• "เดือนนี้มีกี่เหตุ"\n• "ประเภทเหตุที่พบบ่อยที่สุด"\n• "จังหวัดไหนมีเหตุมากที่สุด"\n• "จุดตัดไหนมีเหตุมากที่สุด"\n• "เหตุล่าสุดคือเมื่อไหร่"\n• "เครื่องกั้นชำรุดกี่ครั้ง"';
  }

  /* ---------- chat UI wiring ---------- */
  var chatLog = document.getElementById('chatLog');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');

  function addMsg(text, who){
    var row = document.createElement('div');
    row.className = 'msg ' + who;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatLog.appendChild(row);
    window.scrollTo(0, document.body.scrollHeight);
    return bubble;
  }

  async function handleSend(qText){
    var q = (qText !== undefined ? qText : chatInput.value).trim();
    if (!q) return;
    addMsg(q, 'user');
    chatInput.value = '';
    var loadingBubble = addMsg('กำลังคำนวณ...', 'bot');
    var answer = await answerQuestion(q);
    loadingBubble.textContent = answer;
    window.scrollTo(0, document.body.scrollHeight);
  }

  sendBtn.addEventListener('click', function(){ handleSend(); });
  chatInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){ handleSend(chip.dataset.q); });
  });

  addMsg('สวัสดีครับ ผมช่วยตอบคำถามเกี่ยวกับสถิติเหตุอันตรายจากข้อมูลสดในระบบได้ ลองถามได้เลย หรือกดปุ่มคำถามด่วนด้านบนก็ได้ครับ', 'bot');

  (async function init(){
    await Promise.all([loadIncidents(), loadGeo()]);
  })();
})();
</script>
