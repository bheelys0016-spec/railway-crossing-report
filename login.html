<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เข้าสู่ระบบ — สถิติเหตุอันตรายจุดตัดทางรถไฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-900:#F8FAFC;
    --steel-800:rgba(255,255,255,.94);
    --steel-700:#F2F2F3;
    --steel-600:#E3E3E5;
    --steel-line:#DADADD;
    --paper:#1C1C1E;
    --paper-dim:#6E6E73;
    --amber:#D97706;
    --amber-glow:rgba(217,119,6,.35);
    --amber-dim:#8C6408;
    --red:#DC2626;
    --red-glow:rgba(220,38,38,.35);
    --red-dim:#FDE7E9;
    --green:#2F5233;
    --green-dim:#DCEBDD;
    --submit-stripe:#8E0F22;
    --submit-shadow:#5C0A16;
    --status-text-neg:#8E0F22;
    --deco-stroke:var(--red);
    --deco-opacity:.85;
    --radius:16px;
    --card-shadow:0 12px 32px -4px rgba(15,23,42,.08), 0 0 20px rgba(185,28,28,.06);
  }
  html[data-theme="dark"]{
    --steel-900:#070A11;
    --steel-800:rgba(20,27,44,.88);
    --steel-700:#372316;
    --steel-600:#513521;
    --steel-line:#63432A;
    --paper:#F3E7D3;
    --paper-dim:#C6A87D;
    --amber:#F59E0B;
    --amber-glow:rgba(245,158,11,.45);
    --amber-dim:#8C6A16;
    --red:#EF4444;
    --red-glow:rgba(239,68,68,.45);
    --red-dim:#441313;
    --green:#3E6B47;
    --green-dim:#1B3320;
    --submit-stripe:#7A2424;
    --submit-shadow:#2E0D0D;
    --status-text-neg:#f6c6cb;
    --deco-stroke:var(--amber);
    --deco-opacity:.95;
    --card-shadow:0 12px 35px rgba(0,0,0,.4), 0 0 25px rgba(245,158,11,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--steel-900);
    color:var(--paper);
    font-family:'Prompt',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    position:relative;
  }
  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:80;
    width:42px;height:42px;border-radius:50%;
    background:var(--steel-800);border:1px solid var(--steel-line);
    color:var(--paper);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--card-shadow);
    backdrop-filter:blur(6px);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .theme-toggle:hover{ transform:translateY(-2px) scale(1.05); box-shadow:0 0 15px var(--amber-glow); }
  .lang-toggle{
    position:fixed;top:14px;right:64px;z-index:80;
    width:42px;height:42px;border-radius:10px;
    background:var(--steel-800);border:1px solid var(--steel-line);
    cursor:pointer;padding:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--card-shadow);
    backdrop-filter:blur(6px);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .lang-toggle:hover{ transform:translateY(-2px) scale(1.05); box-shadow:0 0 15px var(--amber-glow); }
  .lang-toggle svg{ width:26px;height:18px;border-radius:3px;display:block; }
  .bg-glow-container{ position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;overflow:hidden; }
  .bg-glow-orb{ position:absolute;border-radius:50%;filter:blur(55px);opacity:.4;animation:floatOrb 20s ease-in-out infinite alternate; }
  .orb-1{ top:-10%;left:10%;width:500px;height:500px;background:radial-gradient(circle,var(--red-glow),transparent 70%); }
  .orb-2{ bottom:-10%;right:10%;width:550px;height:550px;background:radial-gradient(circle,var(--amber-glow),transparent 70%);animation-delay:-10s; }
  @keyframes floatOrb{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(30px,40px) scale(1.15);} }
  #particleCanvas{ position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0; }
  .rail-deco{
    position:fixed;top:0;bottom:0;width:360px;pointer-events:none;z-index:0;
    opacity:var(--deco-opacity);display:none;transition:opacity .3s ease;
  }
  .rail-deco.left{left:12px;} .rail-deco.right{right:12px;}
  .rail-deco svg{width:100%;height:100%;}
  @media (min-width:1280px){ .rail-deco{display:block;} }
  @keyframes radarSweep{ to{ transform:rotate(360deg); } }
  @keyframes pulseNode{ 0%,100%{transform:scale(1);opacity:.9;} 50%{transform:scale(1.35);opacity:.35;} }
  @keyframes trainSpeedLines{ 0%{stroke-dashoffset:100;} 100%{stroke-dashoffset:0;} }
  @keyframes waveFlow{ 0%{transform:translateX(0);} 100%{transform:translateX(-40px);} }
  .anim-radar{ transform-origin:140px 300px; animation:radarSweep 22s linear infinite; }
  .anim-pulse{ transform-origin:center; animation:pulseNode 5s ease-in-out infinite; }
  .anim-dash{ stroke-dasharray:12 8; animation:trainSpeedLines 4.5s linear infinite; }
  .anim-wave{ animation:waveFlow 7s linear infinite; }

  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:380px;
    background:var(--steel-800);
    border:1px solid var(--steel-line);
    border-radius:var(--radius);
    padding:28px 26px;
    text-align:center;
    backdrop-filter:blur(8px);
    box-shadow:var(--card-shadow);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--amber);margin:0 0 8px;
  }
  h1{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em;
    text-transform:uppercase;margin:0 0 6px;color:var(--paper);
  }
  .sub{font-size:12.5px;color:var(--paper-dim);margin:0 0 22px;line-height:1.6;}

  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block;font-size:12px;color:var(--paper-dim);margin-bottom:5px; }
  .field input{
    width:100%;background:var(--steel-700);border:1px solid var(--steel-line);
    border-radius:var(--radius);color:var(--paper);padding:11px 12px;
    font-family:'JetBrains Mono',monospace;font-size:14px;outline:none;
  }
  .field input:focus{ border-color:var(--red); }

  .err{
    display:none;margin:2px 0 14px;padding:9px 12px;border-radius:var(--radius);
    background:var(--red-dim);border:1px solid var(--red);color:var(--status-text-neg);font-size:12.5px;
    text-align:left;
  }
  .err.show{display:block;}

  .submit-bar{
    width:100%;margin-top:4px;padding:14px;border:none;border-radius:var(--radius);
    background:repeating-linear-gradient(135deg,var(--red) 0 16px,var(--submit-stripe) 16px 32px);
    color:#fff;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 3px 0 var(--submit-shadow);
  }
  .submit-bar:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--submit-shadow); }

  .hint{margin-top:18px;font-size:11px;color:var(--paper-dim);}
</style>
</head>
<body>

<div class="bg-glow-container">
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>
</div>
<canvas id="particleCanvas"></canvas>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="สลับโหมดกลางวัน/กลางคืน">☀️</button>
<button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / เปลี่ยนภาษา">🇹🇭</button>

<div class="rail-deco left" aria-hidden="true">
  <svg viewBox="0 0 360 920" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
      <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EF4444" />
        <stop offset="100%" stop-color="#991B1B" />
      </linearGradient>
      <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#B45309" />
      </linearGradient>
      <linearGradient id="gradTower" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--paper-dim)" stop-opacity="0.1"/>
        <stop offset="50%" stop-color="var(--paper)" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="var(--paper-dim)" stop-opacity="0.05"/>
      </linearGradient>
      
      <filter id="glowLightRed" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <filter id="glowLightAmber" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Background Tech Grid Lines -->
    <g opacity="0.18" stroke="var(--paper)" stroke-width="1">
      <path d="M 0 100 H 360 M 0 250 H 360 M 0 400 H 360 M 0 550 H 360 M 0 700 H 360 M 0 850 H 360"/>
      <path d="M 60 0 V 920 M 140 0 V 920 M 220 0 V 920 M 300 0 V 920"/>
    </g>

    <!-- Track Grid Perspective -->
    <g opacity="0.3" stroke="var(--paper)" stroke-width="1.5">
      <line x1="50" y1="920" x2="110" y2="0" stroke-width="3"/>
      <line x1="120" y1="920" x2="135" y2="0" stroke-width="3"/>
      <path d="M 45 900 L 125 900 M 50 840 L 126 840 M 55 780 L 127 780 M 60 720 L 128 720 M 65 660 L 129 660 M 70 600 L 130 600 M 75 540 L 131 540 M 80 480 L 132 480 M 85 420 L 133 420 M 90 360 L 134 360 M 95 300 L 134.5 300"/>
    </g>

    <!-- Radar HUD System (Slowed motion) -->
    <g transform="translate(140, 300)">
      <circle cx="0" cy="0" r="100" stroke="var(--amber)" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 6"/>
      <circle cx="0" cy="0" r="70" stroke="var(--paper)" stroke-width="1" opacity="0.2"/>
      <circle cx="0" cy="0" r="40" stroke="var(--red)" stroke-width="1.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="4" fill="var(--red)" filter="url(#glowLightRed)"/>
      
      <!-- Rotating Radar Beam -->
      <g class="anim-radar">
        <polygon points="0,0 85,-50 100,-20" fill="url(#gradAmber)" opacity="0.25"/>
        <line x1="0" y1="0" x2="95" y2="-30" stroke="var(--amber)" stroke-width="2"/>
      </g>
      
      <!-- Target Nodes -->
      <circle cx="45" cy="-35" r="4" fill="var(--red)" class="anim-pulse" filter="url(#glowLightRed)"/>
      <text x="55" y="-32" font-family="'JetBrains Mono', monospace" font-size="10" fill="var(--red)" font-weight="bold">TARGET_01</text>
      <circle cx="-30" cy="50" r="3.5" fill="var(--amber)" class="anim-pulse" filter="url(#glowLightAmber)"/>
    </g>

    <!-- Modern Smart Railway Signal Tower -->
    <g transform="translate(210, 120)">
      <rect x="35" y="80" width="20" height="600" fill="url(#gradTower)" rx="4"/>
      <line x1="45" y1="80" x2="45" y2="680" stroke="var(--paper)" stroke-width="1" opacity="0.3"/>
      <path d="M 35 120 L 55 160 M 35 160 L 55 120 M 35 240 L 55 280 M 35 280 L 55 240 M 35 360 L 55 400 M 35 400 L 55 360 M 35 480 L 55 520 M 35 520 L 55 480" stroke="var(--paper-dim)" stroke-width="1.5" opacity="0.4"/>

      <!-- High-Tech Signal Box Top -->
      <rect x="15" y="30" width="60" height="150" rx="12" fill="var(--steel-800)" stroke="var(--paper-dim)" stroke-width="2"/>
      <circle cx="45" cy="65" r="18" fill="url(#gradRed)" filter="url(#glowLightRed)"/>
      <circle cx="45" cy="65" r="8" fill="#FFF" opacity="0.8"/>
      
      <circle cx="45" cy="115" r="18" fill="url(#gradAmber)" filter="url(#glowLightAmber)" opacity="0.9"/>
      <circle cx="45" cy="115" r="7" fill="#FFF" opacity="0.6"/>

      <!-- Side Sensor Antenna -->
      <path d="M 75 45 H 105 V 90 H 95" stroke="var(--paper)" stroke-width="2" fill="none" opacity="0.6"/>
      <circle cx="105" cy="45" r="3.5" fill="var(--amber)" class="anim-pulse"/>
    </g>

    <!-- Live Telemetry Card Overlay -->
    <g transform="translate(20, 680)">
      <rect x="0" y="0" width="240" height="110" rx="12" fill="var(--steel-800)" stroke="var(--paper-dim)" stroke-width="1.5" opacity="0.9"/>
      <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="var(--red)">SIGNAL_CROSSING // SENSOR</text>
      <circle cx="16" cy="50" r="4" fill="var(--green)"/>
      <text x="28" y="54" font-family="'Prompt', sans-serif" font-size="11" fill="var(--paper)">ระบบเซนเซอร์: ปกติ (Active)</text>
      <circle cx="16" cy="72" r="4" fill="var(--amber)"/>
      <text x="28" y="76" font-family="'Prompt', sans-serif" font-size="11" fill="var(--paper)">ความถี่สัญญาณ: 5.8 GHz</text>
      <line x1="16" y1="92" x2="224" y2="92" stroke="var(--steel-line)" stroke-width="1"/>
      <rect x="16" y="89" width="60" height="6" rx="3" fill="var(--red)"/>
    </g>
  </svg>
</div>

<div class="rail-deco right" aria-hidden="true">
  <svg viewBox="0 0 360 920" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
      <linearGradient id="gradTrainBody" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="var(--steel-800)" />
        <stop offset="50%" stop-color="var(--steel-700)" />
        <stop offset="100%" stop-color="var(--steel-600)" />
      </linearGradient>
      <linearGradient id="gradGlass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" />
        <stop offset="100%" stop-color="#1E3A8A" />
      </linearGradient>
      <linearGradient id="gradBeam" x1="100%" y1="50%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="var(--amber)" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Dynamic Speed Lines (Slowed down animation) -->
    <g stroke="var(--amber)" opacity="0.5" stroke-width="2" class="anim-dash">
      <path d="M 0 130 H 340 M 40 160 H 360 M 10 190 H 310 M 80 220 H 350 M 20 250 H 330"/>
    </g>

    <!-- Sleek High-Speed Bullet Train -->
    <g transform="translate(10, 200)">
      <polygon points="110,105 -180,210 -180,10" fill="url(#gradBeam)"/>
      <path d="M 110,105 C 150,105 200,45 270,45 L 350,45 L 350,125 L 140,125 Z" fill="url(#gradTrainBody)" stroke="var(--paper-dim)" stroke-width="2"/>
      <path d="M 130,95 C 150,95 185,58 225,58 L 255,58 L 220,95 Z" fill="url(#gradGlass)" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M 270,62 H 350 V 80 H 255 Z" fill="var(--paper)" opacity="0.75"/>
      <line x1="295" y1="62" x2="295" y2="80" stroke="var(--steel-800)" stroke-width="2"/>
      <line x1="325" y1="62" x2="325" y2="80" stroke="var(--steel-800)" stroke-width="2"/>

      <path d="M 115,108 C 170,108 230,98 350,98" stroke="var(--red)" stroke-width="3"/>
      <path d="M 130,114 C 180,114 240,105 350,105" stroke="var(--amber)" stroke-width="2"/>

      <circle cx="115" cy="105" r="7" fill="#FFF" filter="url(#glowLightAmber)"/>
      <circle cx="115" cy="105" r="12" fill="none" stroke="var(--amber)" stroke-width="2"/>

      <line x1="-20" y1="132" x2="360" y2="132" stroke="var(--paper)" stroke-width="4" opacity="0.6"/>
      <line x1="-20" y1="138" x2="360" y2="138" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="10 6" class="anim-dash"/>
    </g>

    <!-- Telemetry Graph UI Card -->
    <g transform="translate(100, 480)">
      <rect x="0" y="0" width="240" height="150" rx="14" fill="var(--steel-800)" stroke="var(--paper-dim)" stroke-width="1.5" opacity="0.92"/>
      <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="var(--amber)">SPEED & ANALYTICAL TELEMETRY</text>
      <rect x="16" y="38" width="208" height="1" fill="var(--steel-line)"/>
      <text x="16" y="68" font-family="'Oswald', sans-serif" font-size="28" font-weight="700" fill="var(--paper)">240 <tspan font-size="14" font-family="'Prompt'" fill="var(--paper-dim)">km/h</tspan></text>
      <text x="140" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="var(--green)">[ REALTIME METRICS ]</text>

      <g transform="translate(16, 82)">
        <rect x="0" y="0" width="208" height="45" rx="6" fill="var(--steel-700)"/>
        <path d="M 5 30 Q 35 5, 65 25 T 125 15 T 175 35 T 203 10" fill="none" stroke="var(--amber)" stroke-width="2"/>
        <path d="M 5 30 Q 35 5, 65 25 T 125 15 T 175 35 T 203 10 L 203 45 L 5 45 Z" fill="url(#gradBeam)" opacity="0.15"/>
        <circle cx="203" cy="10" r="4" fill="var(--amber)" class="anim-pulse"/>
      </g>
    </g>

    <!-- Bottom Decorative Circuit Grid -->
    <g transform="translate(80, 710)" stroke="var(--paper-dim)" opacity="0.3" stroke-width="1.5">
      <path d="M 0 0 L 40 40 H 120 L 150 70 H 220"/>
      <circle cx="0" cy="0" r="4" fill="var(--paper)"/>
      <circle cx="120" cy="40" r="4" fill="var(--amber)"/>
      <circle cx="220" cy="70" r="4" fill="var(--red)"/>
    </g>
  </svg>
</div>

<div class="login-card">
  <p class="eyebrow">Level crossing safety network</p>
  <h1 data-i18n="title">เข้าสู่ระบบ</h1>
  <p class="sub" data-i18n="subtitle">สำหรับเจ้าหน้าที่ — กรอกชื่อผู้ใช้และรหัสผ่านเพื่อดูข้อมูลสถิติ</p>

  <div class="field">
    <label for="userInput" data-i18n="userLabel">ชื่อผู้ใช้</label>
    <input id="userInput" type="text" autocomplete="username" spellcheck="false">
  </div>
  <div class="field">
    <label for="passInput" data-i18n="passLabel">รหัสผ่าน</label>
    <input id="passInput" type="password" autocomplete="current-password">
  </div>

  <div class="err" id="errBox" data-i18n="errMsg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

  <button class="submit-bar" id="loginBtn" data-i18n="loginBtn">เข้าสู่ระบบ</button>
  <p class="hint" data-i18n="hint">เข้าถึงหน้าสถิติและแผนที่สถิติได้หลังเข้าสู่ระบบสำเร็จ</p>
</div>

<script>
(function(){
  /* Canvas Background Particle Animation */
  var canvas = document.getElementById('particleCanvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var particleCount = 14;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  function Particle() { this.reset(); }
  Particle.prototype.reset = function() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + Math.random() * 100;
    this.radius = Math.random() * 3 + 1;
    this.speedY = Math.random() * 0.4 + 0.15;
    this.speedX = (Math.random() - 0.5) * 0.2;
    this.alpha = Math.random() * 0.5 + 0.2;
    this.fade = Math.random() * 0.0015 + 0.0005;
    this.color = Math.random() > 0.4 ? '217, 119, 6' : '220, 38, 38';
  };
  Particle.prototype.update = function() {
    this.y -= this.speedY; this.x += this.speedX; this.alpha -= this.fade;
    if (this.y < -10 || this.alpha <= 0) { this.reset(); }
  };
  Particle.prototype.draw = function() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + this.color + ',' + this.alpha + ')';
    ctx.fill();
  };
  for (var pi = 0; pi < particleCount; pi++) {
    var p = new Particle(); p.y = Math.random() * canvas.height; particles.push(p);
  }
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var j = 0; j < particles.length; j++) { particles[j].update(); particles[j].draw(); }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* ---------- day/night theme toggle ---------- */
  var THEME_KEY = 'railway-theme';
  var toggleBtn = document.getElementById('themeToggle');
  function applyTheme(mode){
    if (mode === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      toggleBtn.textContent = '☀️';
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  toggleBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

  /* ---------- language toggle (TH / EN) ---------- */
  var LANG_KEY = 'railway-lang';
  var FLAG_TH = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#A51931"/><rect y="3.33" width="30" height="13.34" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.66" fill="#2D2A4A"/></svg>';
  var FLAG_GB = '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#00247D"/><g stroke="#FFFFFF" stroke-width="4"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#CF142B" stroke-width="1.6"><line x1="0" y1="0" x2="30" y2="20"/><line x1="30" y1="0" x2="0" y2="20"/></g><g stroke="#FFFFFF" stroke-width="6"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g><g stroke="#CF142B" stroke-width="3"><line x1="15" y1="0" x2="15" y2="20"/><line x1="0" y1="10" x2="30" y2="10"/></g></svg>';
  var langToggle = document.getElementById('langToggle');
  var currentLang = 'th';
  var I18N = {
    th: {
      title: 'เข้าสู่ระบบ',
      subtitle: 'สำหรับเจ้าหน้าที่ — กรอกชื่อผู้ใช้และรหัสผ่านเพื่อดูข้อมูลสถิติ',
      userLabel: 'ชื่อผู้ใช้',
      passLabel: 'รหัสผ่าน',
      errMsg: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
      loginBtn: 'เข้าสู่ระบบ',
      hint: 'เข้าถึงหน้าสถิติและแผนที่สถิติได้หลังเข้าสู่ระบบสำเร็จ'
    },
    en: {
      title: 'Sign In',
      subtitle: 'For staff — enter your username and password to view the statistics',
      userLabel: 'Username',
      passLabel: 'Password',
      errMsg: 'Incorrect username or password',
      loginBtn: 'Sign In',
      hint: 'You can access the stats and map pages after signing in successfully'
    }
  };
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || key; }

  function applyLang(lang){
    currentLang = (lang === 'en') ? 'en' : 'th';
    document.documentElement.setAttribute('lang', currentLang);
    langToggle.innerHTML = currentLang === 'en' ? FLAG_GB : FLAG_TH;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
  }
  var savedLang = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch(e){}
  applyLang(savedLang === 'en' ? 'en' : 'th');
  langToggle.addEventListener('click', function(){
    var next = currentLang === 'en' ? 'th' : 'en';
    applyLang(next);
    try { localStorage.setItem(LANG_KEY, next); } catch(e){}
  });

  /* ---------- credentials ---------- */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq_lB981Yq4JZKKMMy5olDkf3xIaJgoZODZrWs7PwGB0r0t7YvtPQEmNVfxHCa9rb85g/exec';
  var ACCOUNTS = {};
  for (var i = 0; i <= 8; i++){
    var u = 'username' + String(i).padStart(4, '0');
    var p = String(1000 + i);
    ACCOUNTS[u] = p;
  }

  var userInput = document.getElementById('userInput');
  var passInput = document.getElementById('passInput');
  var errBox = document.getElementById('errBox');
  var loginBtn = document.getElementById('loginBtn');

  function getRedirectTarget(){
    var params = new URLSearchParams(window.location.search);
    var r = params.get('redirect');
    if (r && /^[a-zA-Z0-9_\-]+\.html$/.test(r)) return r;
    return 'railway-crossing-stats.html';
  }

  function attemptLogin(){
    var u = userInput.value.trim();
    var p = passInput.value.trim();
    if (ACCOUNTS[u] && ACCOUNTS[u] === p){
      try { sessionStorage.setItem('railway-auth', '1'); } catch(e){}
      try { sessionStorage.setItem('railway-auth-user', u); } catch(e){}
      logLogin(u);
      window.location.href = getRedirectTarget();
    } else {
      errBox.classList.add('show');
    }
  }

  function logLogin(username){
    try{
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: username, timestamp: new Date().toISOString() }),
        keepalive: true
      });
    }catch(e){}
  }

  loginBtn.addEventListener('click', attemptLogin);
  passInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') attemptLogin(); });
  userInput.addEventListener('input', function(){ errBox.classList.remove('show'); });
  passInput.addEventListener('input', function(){ errBox.classList.remove('show'); });
})();
</script>
</body>
</html>
